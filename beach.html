    <section class="patrocinios">

        <div class="apoio">
            <div class="track">
                <div class="slide"><img src="assets/agm.png" alt="Apoio 1"></div>
                <div class="slide"><img src="assets/bilhar_grenal.png" alt="Apoio 2"></div>
                <div class="slide"><img src="assets/klein.png" alt="Apoio 3"></div>

                    <tr class="saquin">

                        </th>
                    </tr>
                    <tr class="avaí">
